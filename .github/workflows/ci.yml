# Continuous integration (CI): runs on every pull request and every push to main.
# The workflow's name is the label on the README badge
# ("Continuous integration tests: passing").
# It repeats what you'd run locally before merging: the pre-commit checks and the tests,
# including a full dbt build on the sample data in tests/sample_data.py.
name: Continuous integration tests

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same pull request cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked

      - name: Pre-commit checks (formatting, lint, file sizes)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests, including dbt build on the sample data
        run: uv run pytest
