version: 2

seeds:
  - name: glucose_lowering_drugs
    description: >
      Every Part D generic name that looks like a diabetes drug or supply, classified by hand.
      Included = in WHO ATC group A10 "Drugs used in diabetes" (https://atcddd.fhi.no/atc_ddd_index/?code=A10).
      Excluded = devices and supplies, and drugs outside A10, each with a reason in `note`.
      Used to define the population at risk: prescribers of any included drug.
    columns:
      - name: generic_name
        description: Exactly as in Part D's Gnrc_Name.
        data_tests: [unique, not_null]
      - name: included
        data_tests: [not_null]
      - name: atc_group
        description: WHO ATC level-4 group, e.g. A10BJ (GLP-1 receptor agonists). Blank if excluded.
      - name: drug_class
        description: Pharmacological class used in this project's charts and substitution analysis.

  - name: specialty_groups
    description: >
      Every Part D prescriber type (specialty label), with a harmonised specialty name that merges
      spelling variants (e.g. "Orthopaedic Surgery" into "Orthopedic Surgery", "Family Medicine" into
      "Family Practice") and one of 13 broad groups used in the charts.
    columns:
      - name: prescriber_type
        description: Exactly as in Part D's Prscrbr_Type.
        data_tests: [unique, not_null]
      - name: specialty
        data_tests: [not_null]
      - name: specialty_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Primary care physician
                  - Advanced practice nurse
                  - Physician assistant
                  - Endocrinology
                  - Cardiology
                  - Nephrology
                  - Obstetrics and gynecology
                  - Hospital and emergency medicine
                  - Physician in training
                  - Other physician specialty
                  - Pharmacist
                  - Other prescriber
                  - Organization or unknown

  - name: specialty_expectations
    description: >
      Whether each specialty would be expected to prescribe a diabetes drug, with a reason. A
      row with no specialty applies to the whole specialty group; a row with a specialty
      overrides its group. "Expected": diabetes is their everyday work. "Plausible": a clinical
      reason, such as a condition linked to diabetes, or continuing patients' usual medicines.
      "Unexpected": their patients' diabetes is usually managed by another doctor. Decided by
      hand (decision D47), for diabetes prescribing: the data can't say why semaglutide was
      prescribed.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [specialty_group, specialty]
    columns:
      - name: specialty_group
        data_tests: [not_null]
      - name: expectation
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [expected, plausible, unexpected, unknown]
      - name: reason
        data_tests: [not_null]

  - name: scottish_health_boards
    description: >
      Scotland's NHS health boards, by code. Copied from Public Health Scotland's "Health Board
      2014 - Health Board 2019" geography codes (opendata.nhs.scot). Four boards got new codes
      in 2018-2019 when their boundaries were adjusted; both codes are listed, with dates.
    columns:
      - name: health_board_code
        data_tests: [unique, not_null]
      - name: health_board_name
        data_tests: [not_null]

  - name: welsh_health_boards
    description: >
      Wales's seven local health boards, by code, as named in the NHS Organisation Data
      Service. Abertawe Bro Morgannwg became Swansea Bay, and Cwm Taf became Cwm Taf
      Morgannwg, in April 2019 when Bridgend moved between them; the codes didn't change, so
      the current names are used throughout.
    columns:
      - name: health_board_code
        data_tests: [unique, not_null]
