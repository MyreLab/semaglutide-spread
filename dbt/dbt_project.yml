name: semaglutide_spread
version: "0.1.0"
profile: semaglutide_spread

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "logs"]

models:
  semaglutide_spread:
    staging:
      # Staging models only rename, type and select columns, so they are views: nothing is
      # copied, and each query reads the Parquet files directly.
      +materialized: view
    intermediate:
      # Intermediate models join and apply logic, and are reused by several later models,
      # so they are stored as tables.
      +materialized: table
    marts:
      # The analysis tables: population at risk and adopters.
      +materialized: table
    reports:
      +materialized: table

vars:
  # The drug whose spread is tracked, exactly as Part D writes its generic name. Changing it
  # (e.g. to "Tirzepatide") re-runs the whole analysis for another drug.
  target_generic_name: Semaglutide
  # The same drug in the UK's British National Formulary (BNF chemical substance code).
  target_bnf_chemical_code: "0601023AW"

seeds:
  semaglutide_spread:
    # Each seed's column types, so dbt doesn't guess (e.g. a code with leading zeros).
    glucose_lowering_drugs:
      +column_types:
        generic_name: varchar
        included: boolean
        atc_group: varchar
        drug_class: varchar
        note: varchar
    specialty_groups:
      +column_types:
        prescriber_type: varchar
        specialty: varchar
        specialty_group: varchar
    scottish_health_boards:
      +column_types:
        health_board_code: varchar
        health_board_name: varchar
        enacted: date
        archived: date
    welsh_health_boards:
      +column_types:
        health_board_code: varchar
        health_board_name: varchar

flags:
  send_anonymous_usage_stats: false
