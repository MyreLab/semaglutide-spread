name: semaglutide_spread
version: "0.1.0"
profile: semaglutide_spread

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
clean-targets: ["target", "logs"]

models:
  semaglutide_spread:
    staging:
      # Staging models only rename, type and select columns, so they are views: nothing is
      # copied, and each query reads the Parquet files directly.
      +materialized: view
    intermediate:
      # Intermediate models join and apply logic, and are reused by several later models,
      # so they are stored as tables.
      +materialized: table
    reports:
      +materialized: table

seeds:
  semaglutide_spread:
    +column_types:
      generic_name: varchar
      included: boolean
      atc_group: varchar
      drug_class: varchar
      note: varchar
      prescriber_type: varchar
      specialty: varchar
      specialty_group: varchar

flags:
  send_anonymous_usage_stats: false
