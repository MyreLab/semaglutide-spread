version: 2

models:
  - name: rpt_prescriber_location_coverage
    description: >
      Match-rate report: prescriber-years by year and location method, with each method's
      share of the year.

  - name: rpt_us_adoption_curve
    description: >
      The epidemic curve, one row per year: population at risk, susceptible prescribers, new
      adopters, incidence and prevalence of adoption, cumulative adopters, and the same
      prevalence among all Part D prescribers (sensitivity analysis). Column definitions are
      at the top of the model's SQL.
    columns:
      - name: year
        data_tests: [unique, not_null]

  - name: rpt_uk_adoption_curve
    description: >
      The UK epidemic curves, one row per nation x month, for both adoption measures:
      population at risk, susceptible, new adopters, incidence and prevalence. Definitions at
      the top of the model's SQL.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [nation, month]

  - name: rpt_us_prescription_share
    description: >
      Semaglutide's share of glucose-lowering prescriptions in Medicare Part D, one row per
      year, by claims and by 30-day fills. Volume, not adoption: every prescriber counts.
    columns:
      - name: year
        data_tests: [unique, not_null]
      - name: glucose_lowering_claims
        data_tests: [not_null]
      - name: target_drug_claims
        data_tests: [not_null]

  - name: rpt_uk_prescription_share
    description: >
      Semaglutide's share of glucose-lowering prescription items from UK GP practices, one
      row per nation x calendar year, with the number of months each year has.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [nation, year]
    columns:
      - name: glucose_lowering_items
        data_tests: [not_null]
      - name: target_drug_items
        data_tests: [not_null]

  - name: rpt_us_adopters_by_specialty
    description: >
      US adopters by specialty group x specialty, with whether the specialty would be expected
      to prescribe a diabetes drug (expected / plausible / unexpected / unknown) and why.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [specialty_group, specialty]
    columns:
      - name: expectation
        data_tests: [not_null]
      - name: reason
        data_tests: [not_null]
      - name: adopters
        data_tests: [not_null]
