version: 2

models:
  - name: stg_partd__prescriber_drugs
    description: >
      One row per prescriber (NPI) x drug (brand and generic name) x year, from Medicare Part D
      "by Provider and Drug". Each row aggregates 11 or more claims.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [year, npi, brand_name, generic_name]
    columns:
      - name: year
        data_tests: [not_null, {at_least: {arguments: {min_value: 2018}}}]
      - name: npi
        description: National Provider Identifier (10 digits).
        data_tests: [not_null]
      - name: generic_name
        data_tests: [not_null]
      - name: total_claims
        description: >
          Claims, counting refills. CMS publishes only rows with 11 or more; this test checks it.
        data_tests: [not_null, {at_least: {arguments: {min_value: 11}}}]
      - name: total_drug_cost
        description: Gross drug cost paid at the pharmacy, before manufacturer rebates.
        data_tests: [{at_least: {arguments: {min_value: 0}}}]
      - name: total_beneficiaries
        description: Distinct patients. Null where CMS suppressed a count below 11.
        data_tests: [{at_least: {arguments: {min_value: 11}}}]

  - name: stg_partd__prescribers
    description: >
      One row per prescriber x year from Medicare Part D "by Provider": practice address, ZIP code,
      specialty and total prescribing.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [year, npi]
    columns:
      - name: year
        data_tests: [not_null, {at_least: {arguments: {min_value: 2018}}}]
      - name: npi
        data_tests: [not_null]
      - name: entity_type
        data_tests:
          - accepted_values:
              arguments:
                values: [individual, organization]
      - name: zip5
        description: 5-digit ZIP code. Null for some prescribers outside the US.
      - name: ruca_code
        description: Rural-Urban Commuting Area code of the prescriber's ZIP code.

  - name: stg_census__zcta_centroids
    description: One row per 2020 ZIP Code Tabulation Area (ZCTA), with its internal point.
    columns:
      - name: zcta
        data_tests: [unique, not_null]
      - name: latitude
        data_tests: [not_null]
      - name: longitude
        data_tests: [not_null]

  - name: stg_census__zcta_counties
    description: >
      One row per part of a 2020 ZCTA lying in a 2020 county. A ZCTA that crosses county lines
      has several rows.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [zcta, county_fips]
    columns:
      - name: zcta
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_census__zcta_centroids')
                field: zcta
      - name: county_fips
        data_tests: [not_null]

  - name: stg_census__geocoded_addresses
    description: >
      One row per prescriber address sent to the Census geocoder (those whose ZIP code is not a
      ZCTA), matched or not.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [street_1, street_2, city, state, zip5]
    columns:
      - name: geocode_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [Match, No_Match, Tie]

  - name: stg_epd__diabetes_items
    description: >
      England: one row per prescribing organisation x BNF chemical substance x month (and
      presentation, for the target drug), for BNF 6.1.1 insulins and 6.1.2 antidiabetic drugs.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, practice_code, bnf_chemical_code, target_presentation]
    columns:
      - name: month
        data_tests: [not_null]
      - name: bnf_chemical_code
        description: 9-character BNF chemical substance code; starts 060101 or 060102.
        data_tests: [not_null]
      - name: items
        description: Prescription items. Not suppressed, so can be as low as 1.
        data_tests: [not_null, {at_least: {arguments: {min_value: 1}}}]
      - name: target_brand
        description: Ozempic, Rybelsus, Wegovy or "Generic name"; null for other drugs.
        data_tests:
          - accepted_values:
              arguments:
                values: [Ozempic, Rybelsus, Wegovy, Generic name]

  - name: stg_epd__practices
    description: "England: one row per prescribing organisation x month, with address and postcode."
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, practice_code]
    columns:
      - name: practice_code
        data_tests: [not_null]
      - name: postcode
        description: Tidied to "AB1 2CD"; null when missing.

  - name: stg_postcodes
    description: One row per UK practice postcode, with location and areas from postcodes.io.
    columns:
      - name: postcode
        data_tests: [unique, not_null]
      - name: lookup_status
        data_tests:
          - accepted_values:
              arguments:
                values: [current, terminated, not_found]

  - name: stg_phs__diabetes_items
    description: >
      Scotland: one row per practice code x BNF chemical substance x paid month (and
      presentation, for the target drug), BNF 6.1.1 and 6.1.2.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, practice_code, bnf_chemical_code, target_presentation]
    columns:
      - name: items
        description: Paid items (at least 1 in every row so far).
      - name: target_brand
        data_tests:
          - accepted_values:
              arguments:
                values: [Ozempic, Rybelsus, Wegovy, Generic name]

  - name: stg_phs__practices
    description: "Scotland: one row per practice code x paid month, with total items."
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, practice_code]

  - name: stg_phs__register
    description: "Scotland's GP practice register: one row per practice x quarter."
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [quarter, practice_code]
    columns:
      - name: health_board_code
        data_tests:
          - relationships:
              arguments:
                to: ref('scottish_health_boards')
                field: health_board_code

  - name: stg_ods__gp_practices
    description: >
      Prescribing cost centres that ODS lists as GP practices (role RO76), open or closed.
    columns:
      - name: practice_code
        data_tests: [unique, not_null]

  - name: stg_ni__diabetes_items
    description: >
      Northern Ireland: one row per practice x substance x month (and product, for the target
      drug), BNF 6.1.1 and 6.1.2.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, practice_code, substance, target_presentation]
    columns:
      - name: target_brand
        data_tests:
          - accepted_values:
              arguments:
                values: [Ozempic, Rybelsus, Wegovy, Generic name]

  - name: stg_ni__practices
    description: "Northern Ireland: one row per practice x month, with total items."
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, practice_code]

  - name: stg_ni__register
    description: "Northern Ireland's GP practice reference files: one row per practice x release."
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [release_month, practice_code]

  - name: stg_wales__diabetes_items
    description: >
      Wales: one row per practice x BNF chemical substance x month (and product, for the
      target drug), BNF 6.1.1 and 6.1.2.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, practice_code, bnf_chemical_code, target_presentation]
    columns:
      - name: target_brand
        data_tests:
          - accepted_values:
              arguments:
                values: [Ozempic, Rybelsus, Wegovy, Generic name]

  - name: stg_wales__practices
    description: "Wales: one row per prescribing organisation x month, with total items."
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, practice_code]
    columns:
      - name: health_board_code
        data_tests:
          - relationships:
              arguments:
                to: ref('welsh_health_boards')
                field: health_board_code

  - name: stg_wales__register
    description: "Wales: the monthly address file, one row per prescribing organisation x month."
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, practice_code]
