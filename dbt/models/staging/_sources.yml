version: 2

# Every raw table is Parquet written by the downloaders in src/semaglutide_spread/sources/.
# All columns are text; the staging models assign types. SEMAGLUTIDE_DATA_DIR is set by
# `uv run build-warehouse`.

sources:
  - name: partd
    description: >
      Medicare Part D Prescribers (CMS), one folder per data year, downloaded by
      `partd-download`. Rows with fewer than 11 claims are not published.
    meta:
      external_location: "read_parquet('{{ env_var('SEMAGLUTIDE_DATA_DIR', '../data') }}/raw/partd_{name}/*/data.parquet', hive_partitioning = true)"
    tables:
      - name: by_provider_and_drug
        description: One row per prescriber x drug (brand and generic name) x year.
      - name: by_provider
        description: One row per prescriber x year, with address and ZIP code.

  - name: census
    description: Census Bureau reference files and geocoder results.
    tables:
      - name: zcta2020_gazetteer
        description: One row per 2020 ZIP Code Tabulation Area (ZCTA), with its internal point.
        meta:
          external_location: "read_parquet('{{ env_var('SEMAGLUTIDE_DATA_DIR', '../data') }}/raw/census_zcta2020_gazetteer/data.parquet')"
      - name: zcta2020_counties
        description: One row per part of a 2020 ZCTA that lies in a 2020 county.
        meta:
          external_location: "read_parquet('{{ env_var('SEMAGLUTIDE_DATA_DIR', '../data') }}/raw/census_zcta2020_counties/data.parquet')"
      - name: geocoder
        description: >
          Census batch geocoder results for prescriber addresses whose ZIP code is not a ZCTA,
          written by `geocode-addresses`. One row per distinct address, matched or not.
        meta:
          external_location: "read_parquet('{{ env_var('SEMAGLUTIDE_DATA_DIR', '../data') }}/raw/census_geocoder/data.parquet')"

  - name: epd
    description: >
      English Prescribing Dataset (NHSBSA), one folder per month, downloaded by `epd-download`
      as query results: diabetes drugs by practice and chemical substance, and every
      practice's address. Nothing is suppressed: single items are published.
    meta:
      external_location: "read_parquet('{{ env_var('SEMAGLUTIDE_DATA_DIR', '../data') }}/raw/epd_{name}/*/data.parquet', hive_partitioning = true)"
    tables:
      - name: diabetes
        description: >
          One row per practice x BNF chemical substance x month, for BNF 6.1.1 (insulins) and
          6.1.2 (antidiabetic drugs); semaglutide rows are also split by presentation.
      - name: practices
        description: One row per practice x month, with name, address, postcode and total items.

  - name: ods
    description: NHS Organisation Data Service (the official register of NHS organisations).
    tables:
      - name: gp_practices
        description: >
          Every prescribing cost centre that is a GP practice, open or closed, written by
          `ods-download`.
        meta:
          external_location: "read_parquet('{{ env_var('SEMAGLUTIDE_DATA_DIR', '../data') }}/raw/ods_gp_practices/data.parquet')"

  - name: phs
    description: >
      Public Health Scotland open data, downloaded by `phs-download`: monthly prescribing by
      GP practice (diabetes drugs by practice and chemical substance, and every practice
      code's total items), by paid month, and the quarterly GP practice register.
    meta:
      external_location: "read_parquet('{{ env_var('SEMAGLUTIDE_DATA_DIR', '../data') }}/raw/phs_{name}/*/data.parquet', hive_partitioning = true)"
    tables:
      - name: diabetes
        description: One row per practice code x BNF chemical substance x paid month (x presentation, for the target drug).
      - name: practices
        description: One row per practice code x paid month, with total items of all drugs.
      - name: register
        description: One row per GP practice x quarter, with name, address, postcode, list size and health board.

  - name: ni
    description: >
      Northern Ireland GP prescribing (Business Services Organisation, via OpenDataNI),
      filtered by `ni-download`: diabetes drugs by practice and substance, every practice's
      total items, and the GP practice reference files.
    meta:
      external_location: "read_parquet('{{ env_var('SEMAGLUTIDE_DATA_DIR', '../data') }}/raw/ni_{name}/*/data.parquet', hive_partitioning = true)"
    tables:
      - name: diabetes
        description: One row per practice x substance x month (x product, for the target drug), BNF 6.1.1 and 6.1.2.
      - name: practices
        description: One row per practice x month, with total items of all drugs.
      - name: register
        description: One row per GP practice x reference-file release, with address, postcode, LCG and registered patients.

  - name: wales
    description: >
      Wales GP prescribing (NHS Wales Shared Services Partnership), filtered by
      `wales-download`: diabetes drugs by practice and chemical substance, every practice's
      total items, and the monthly practice address files.
    meta:
      external_location: "read_parquet('{{ env_var('SEMAGLUTIDE_DATA_DIR', '../data') }}/raw/wales_{name}/*/data.parquet', hive_partitioning = true)"
    tables:
      - name: diabetes
        description: One row per practice x BNF chemical substance x month (x product, for the target drug), BNF 6.1.1 and 6.1.2.
      - name: practices
        description: One row per practice x month, with its health board and total items.
      - name: register
        description: One row per prescribing organisation x month in the address file, with name, address and postcode.

  - name: postcodes_io
    description: UK postcode lookups from postcodes.io (ONS Postcode Directory).
    tables:
      - name: postcodes
        description: >
          One row per practice postcode, written by `postcode-lookup`: location and areas for
          current postcodes, location only for terminated ones.
        meta:
          external_location: "read_parquet('{{ env_var('SEMAGLUTIDE_DATA_DIR', '../data') }}/raw/postcodes/data.parquet')"
