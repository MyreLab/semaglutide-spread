version: 2

models:
  - name: int_zcta_primary_county
    description: >
      One row per 2020 ZCTA, with its internal point and the 2020 county holding most of its
      land area.
    columns:
      - name: zcta
        data_tests: [unique, not_null]
      - name: county_fips
        data_tests: [not_null]

  - name: int_prescriber_locations
    description: >
      One row per prescriber x year, with a map location and 2020 county. `location_method`
      records how each was placed (see the model's SQL for the order of methods).
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [year, npi]
    columns:
      - name: location_method
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - zcta_centroid
                  - geocoded_address
                  - zip_geocoded_median
                  - zip3_median
                  - unplaced
      - name: unplaced_reason
        description: Why a prescriber-year has no location. Null when placed.
        data_tests:
          - accepted_values:
              arguments:
                values: [outside_us, military_mail, no_zip_code, no_nearby_zcta]
      - name: latitude
        data_tests: [{at_least: {arguments: {min_value: -15}}}]
      - name: county_fips
        description: 2020 county FIPS code (5 digits).

  - name: int_prescriber_years
    description: >
      One row per prescriber x year: specialty (from the specialty_groups seed), location and
      county (from int_prescriber_locations), and total Part D claims.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [year, npi]
    columns:
      - name: specialty_group
        data_tests: [not_null]
      - name: location_method
        data_tests: [not_null]

  - name: int_epd_practice_months
    description: >
      England: one row per prescribing organisation x month (unidentified prescriptions left
      out), with location from the postcode and items of all drugs, glucose-lowering drugs and
      the target drug.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, practice_code]
    columns:
      - name: postcode_status
        description: current, terminated, not_found, or not_looked_up (run postcode-lookup).
        data_tests:
          - accepted_values:
              arguments:
                values: [current, terminated, not_found, not_looked_up]

  - name: int_phs_practice_months
    description: >
      Scotland: one row per GP practice (codes in the practice register) x month, with
      register details as of that month, location from the postcode, and items.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [month, practice_code]
    columns:
      - name: nhs_area_name
        description: Health board name.
        data_tests: [not_null]

  - name: int_uk_practice_months
    description: >
      One row per UK GP practice x month, every nation stacked with the same columns. Practice
      codes are unique only within a nation.
    data_tests:
      - unique_combination_of_columns:
          arguments:
            combination_of_columns: [nation, practice_code, month]
