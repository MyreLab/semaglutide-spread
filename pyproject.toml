[project]
name = "semaglutide-spread"
version = "0.1.0"
description = "How semaglutide (Ozempic, Rybelsus, Wegovy) spread through prescribers in the US and the UK, tracked like an epidemic."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Myrela Bauman" }]
requires-python = ">=3.12"
# Runtime libraries are added by the pull request that first needs them.
dependencies = [
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
]

[project.scripts]
partd-download = "semaglutide_spread.sources.partd:main"
census-download = "semaglutide_spread.sources.census:main"
geocode-addresses = "semaglutide_spread.sources.geocoder:main"
epd-download = "semaglutide_spread.sources.epd:main"
postcode-lookup = "semaglutide_spread.sources.postcodes:main"
phs-download = "semaglutide_spread.sources.phs:main"
ods-download = "semaglutide_spread.sources.ods:main"
ni-download = "semaglutide_spread.sources.ni:main"
build-warehouse = "semaglutide_spread.warehouse:main"
night-lights = "semaglutide_spread.viz.night_lights:main"
adoption-curve = "semaglutide_spread.viz.adoption_curve:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semaglutide_spread"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W: style errors, F: real bugs (undefined names, unused imports), I: import order,
# B: common bug patterns, UP: modern Python syntax, SIM: simpler code, RUF: ruff's own rules.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
